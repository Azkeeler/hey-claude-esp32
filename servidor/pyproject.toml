[project]
name = "asistente"
version = "0.1.0"
description = "Servidor de voz para el ESP32 (xiaozhi) que habla con Claude Code"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp==3.14.5",
    "faster-whisper==1.2.1",
    "claude-agent-sdk==0.2.187",
    "piper-tts==1.8.0",
    "opuslib==3.0.1",
    "webrtcvad-wheels==2.0.14.post1",
    "soxr==1.1.0",
    "numpy==2.5.5",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.setuptools]
packages = ["asistente"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["pruebas"]
pythonpath = ["."]
